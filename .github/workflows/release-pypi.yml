name: Release PyPI

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing immutable release tag to publish (for missed tag events)"
        required: true
        type: string

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  resolve-release:
    name: Resolve immutable release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      commit: ${{ steps.release.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Validate release identity
        id: release
        shell: bash
        run: |
          if [[ ! "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "release tag must use vMAJOR.MINOR.PATCH form" >&2
            exit 1
          fi
          version="${RELEASE_TAG#v}"
          commit="$(git rev-parse HEAD)"
          test "$(git rev-list -n1 "${RELEASE_TAG}")" = "${commit}"
          test "$(sed -n 's/^version = "\([^"]*\)"/\1/p' packages/agentd-py/pyproject.toml | head -1)" = "${version}"
          echo "tag=${RELEASE_TAG}" >> "${GITHUB_OUTPUT}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "commit=${commit}" >> "${GITHUB_OUTPUT}"

  build-wheels:
    name: Build wheel (${{ matrix.goos }}-${{ matrix.goarch }})
    needs: resolve-release
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: darwin
            goarch: arm64
            runner: ubuntu-latest
            wheel_plat: macosx_11_0_arm64
          - goos: darwin
            goarch: amd64
            runner: ubuntu-latest
            wheel_plat: macosx_10_9_x86_64
          - goos: linux
            goarch: amd64
            runner: ubuntu-latest
            wheel_plat: manylinux_2_17_x86_64
          - goos: linux
            goarch: arm64
            runner: ubuntu-latest
            wheel_plat: manylinux_2_17_aarch64

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-release.outputs.tag }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.2"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify committed wrapper version
        env:
          VERSION: ${{ needs.resolve-release.outputs.version }}
        run: test "$(sed -n 's/^version = "\([^"]*\)"/\1/p' packages/agentd-py/pyproject.toml | head -1)" = "${VERSION}"

      - name: Build agentd binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
          VERSION: ${{ needs.resolve-release.outputs.version }}
          COMMIT: ${{ needs.resolve-release.outputs.commit }}
        run: |
          go build -trimpath -ldflags="-s -w -X github.com/danieliser/agentruntime/pkg/buildinfo.Version=${VERSION} -X github.com/danieliser/agentruntime/pkg/buildinfo.Commit=${COMMIT}" -o packages/agentd-py/agentruntime_agentd/bin/agentd ./cmd/agentd

      - name: Verify embedded version
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        env:
          VERSION: ${{ needs.resolve-release.outputs.version }}
          COMMIT: ${{ needs.resolve-release.outputs.commit }}
        run: |
          test "$(packages/agentd-py/agentruntime_agentd/bin/agentd --version)" = "${VERSION}"
          packages/agentd-py/agentruntime_agentd/bin/agentd --require-build "${VERSION}@${COMMIT}"

      - name: Install build tools
        run: pip install build wheel

      - name: Build platform wheel
        working-directory: packages/agentd-py
        env:
          WHEEL_PLAT: ${{ matrix.wheel_plat }}
        run: |
          python -m build --wheel
          # Rename wheel to use platform-specific tag
          cd dist
          for f in *.whl; do
            newname=$(echo "$f" | sed "s/py3-none-any/py3-none-${WHEEL_PLAT}/")
            if [ "$f" != "$newname" ]; then
              mv "$f" "$newname"
            fi
          done

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.goos }}-${{ matrix.goarch }}
          path: packages/agentd-py/dist/*.whl

  # Also build musl variants for Linux
  build-wheels-musl:
    name: Build wheel (linux-${{ matrix.goarch }}-musl)
    needs: resolve-release
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goarch: amd64
            wheel_plat: musllinux_1_1_x86_64
          - goarch: arm64
            wheel_plat: musllinux_1_1_aarch64

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-release.outputs.tag }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.2"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify committed wrapper version
        env:
          VERSION: ${{ needs.resolve-release.outputs.version }}
        run: test "$(sed -n 's/^version = "\([^"]*\)"/\1/p' packages/agentd-py/pyproject.toml | head -1)" = "${VERSION}"

      - name: Build agentd binary
        env:
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
          VERSION: ${{ needs.resolve-release.outputs.version }}
          COMMIT: ${{ needs.resolve-release.outputs.commit }}
        run: |
          go build -trimpath -ldflags="-s -w -X github.com/danieliser/agentruntime/pkg/buildinfo.Version=${VERSION} -X github.com/danieliser/agentruntime/pkg/buildinfo.Commit=${COMMIT}" -o packages/agentd-py/agentruntime_agentd/bin/agentd ./cmd/agentd

      - name: Install build tools
        run: pip install build wheel

      - name: Build platform wheel
        working-directory: packages/agentd-py
        env:
          WHEEL_PLAT: ${{ matrix.wheel_plat }}
        run: |
          python -m build --wheel
          cd dist
          for f in *.whl; do
            newname=$(echo "$f" | sed "s/py3-none-any/py3-none-${WHEEL_PLAT}/")
            if [ "$f" != "$newname" ]; then
              mv "$f" "$newname"
            fi
          done

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheel-linux-${{ matrix.goarch }}-musl
          path: packages/agentd-py/dist/*.whl

  publish:
    name: Publish to PyPI
    needs: [build-wheels, build-wheels-musl]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
    steps:
      - name: Download all wheel artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true

      - name: List wheels
        run: ls -la dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          skip-existing: true
